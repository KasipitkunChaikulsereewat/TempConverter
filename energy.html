<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnergyConverter</title>
    <link rel="stylesheet" href="lengthstyles.css">
</head>
<body>
    <div class="formContainer">
        <form>
            <h1>Energy Unit Converter</h1>
            <input type="number" id="inputSI" placeholder="Enter Energy"><br>
            <div class="dropDownContainer">
                <label for="unitFrom">From</label>
                <select id="unitFrom">
                    <option value="">--Select Unit--</option>
                    <option value="j">Joule (J)</option>
                    <option value="kj">Kilojoule (kJ)</option>
                    <option value="cal">Calorie (cal)</option>
                    <option value="kcal">Kilocalorie (kcal)</option>
                    <option value="wh">Watt-hour (Wh)</option>
                    <option value="kwh">Kilowatt-hour (kWh)</option>
                    <option value="ev">Electronvolt (eV)</option>
                </select>

                <label for="unitTo">To</label>
                <select id="unitTo">
                    <option value="">--Select Unit--</option>
                    <option value="j">Joule (J)</option>
                    <option value="kj">Kilojoule (kJ)</option>
                    <option value="cal">Calorie (cal)</option>
                    <option value="kcal">Kilocalorie (kcal)</option>
                    <option value="wh">Watt-hour (Wh)</option>
                    <option value="kwh">Kilowatt-hour (kWh)</option>
                    <option value="ev">Electronvolt (eV)</option>
                </select>
            </div>
            <button type="button" id="convertbtnSI">Convert</button>
            <p id="resultSI">select a unit</p>

        </form>
    </div>
    <script src="energy.js"></script>
</body>
</html>
