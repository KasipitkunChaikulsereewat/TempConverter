<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LengthConverter</title>
    <link rel="stylesheet" href="energystyles.css">
</head>
<body>
    <div class="nav">
        <button class="dropbtn">☰</button>
        <div class="dropdown-content" id="mydropdown">
            <a href="index.html">Home</a>
            <a href="temp.html">Temperature</a>
            <a href="mass.html">Mass</a>
            <a href="length.html">Length</a>
            <a href="time.html">Time</a>
            <a href="energy.html">Energy</a>
            <a href="speed.html">Speed</a>
            <a href="area.html">Area</a>
            <a href="volume.html">Volume</a>
        </div>
    </div>
    
    <div class="formContainer">
        <form>
            <h1>Length Unit Converter</h1>
            <input type="number" id="input" placeholder="Enter Length"><br>
            <div class="dropDownContainer">
                <label for="unitFrom">From</label>
                <select id="unitFrom">
                    <option value="">--Select Unit--</option>
                    <option value="nm">Nanometers</option>
                    <option value="um">Micrometers</option>
                    <option value="mm">Millimeters</option>
                    <option value="cm">Centimeters</option>
                    <option value="in">Inches</option>
                    <option value="ft">Feet</option>
                    <option value="yd">Yards</option>
                    <option value="m">Meters</option>
                    <option value="km">Kilometers</option>
                    <option value="mi">Miles</option>
                    <option value="nmi">Nautical Miles</option>
                    <option value="AU">Astronomical Units</option>
                    <option value="lyr">Light Years</option>
                    <option value="pc">Parsecs</option>
                </select>

                <label for="unitTo">To</label>
                <select id="unitTo">
                    <option value="">--Select Unit--</option>
                    <option value="nm">Nanometers</option>
                    <option value="um">Micrometers</option>
                    <option value="mm">Millimeters</option>
                    <option value="cm">Centimeters</option>
                    <option value="in">Inches</option>
                    <option value="ft">Feet</option>
                    <option value="yd">Yards</option>
                    <option value="m">Meters</option>
                    <option value="km">Kilometers</option>
                    <option value="mi">Miles</option>
                    <option value="nmi">Nautical Miles</option>
                    <option value="AU">Astronomical Units</option>
                    <option value="lyr">Light Years</option>
                    <option value="pc">Parsecs</option>
                </select>
            </div>
            <button type="button" id="convertbtn">Convert</button>
            <p id="result">select a unit</p>

        </form>
    </div>
    <script src="length.js"></script>
</body>
</html>
