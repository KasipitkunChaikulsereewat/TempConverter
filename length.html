        <form>
            <h1>Length Unit Converter</h1>
            <input type="number" id="inputSI" placeholder="Enter Length"><br>
            <div class="dropDownContainer">
                <label for="unitFrom">From</label>
                <select id="unitFrom">
                    <option value="">--Select Unit--</option>
                    <option value="nm">Nanometers</option>
                    <option value="um">Micrometers</option>
                    <option value="mm">Millimeters</option>
                    <option value="cm">Centimeters</option>
                    <option value="in">Inches</option>
                    <option value="ft">Feet</option>
                    <option value="yd">Yards</option>
                    <option value="m">Meters</option>
                    <option value="km">Kilometers</option>
                    <option value="mi">Miles</option>
                    <option value="nmi">Nautical Miles</option>
                    <option value="AU">Astronomical Units</option>
                    <option value="lyr">Light Years</option>
                    <option value="pc">Parsecs</option>
                </select>

                <label for="unitTo">To</label>
                <select id="unitTo">
                    <option value="">--Select Unit--</option>
                    <option value="nm">Nanometers</option>
                    <option value="um">Micrometers</option>
                    <option value="mm">Millimeters</option>
                    <option value="cm">Centimeters</option>
                    <option value="in">Inches</option>
                    <option value="ft">Feet</option>
                    <option value="yd">Yards</option>
                    <option value="m">Meters</option>
                    <option value="km">Kilometers</option>
                    <option value="mi">Miles</option>
                    <option value="nmi">Nautical Miles</option>
                    <option value="AU">Astronomical Units</option>
                    <option value="lyr">Light Years</option>
                    <option value="pc">Parsecs</option>
                </select>
            </div>
            <button type="button" id="convertbtnSI">Convert</button>
            <p id="resultSI">select a unit</p>

        </form>
    </div>
    <script src="length.js"></script>
</body>
