<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VolumeConverter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="energystyles.css">
</head>
<body>
    <div class="nav">
        <button class="dropbtn">☰</button>
        <div class="dropdown-content" id="mydropdown">
            <input type="text" placeholder="Search..." id="searchInput" onkeyup="filterFunction()">
            <a href="index.html">Home</a>
            <a href="temp.html">Temperature</a>
            <a href="mass.html">Mass</a>
            <a href="length.html">Length</a>
            <a href="time.html">Time</a>
            <a href="energy.html">Energy</a>
            <a href="speed.html">Speed</a>
            <a href="area.html">Area</a>
            <a href="volume.html">Volume</a>
        </div>
    </div>
    
    <div class="formContainer">
        <form>
            <h1>Volume Unit Converter</h1>
            <input type="number" id="input" placeholder="Enter Volume"><br>
            <div class="dropDownContainer">
                <label for="unitFrom">From</label>
                <select id="unitFrom">
                    <option value="">--Select Unit--</option>
                    <option value="nm^3">Cubic Nanometers</option>
                    <option value="um^3">Cubic Micrometers</option>
                    <option value="mm^3">Cubic Millimeters</option>
                    <option value="cm^3">Cubic Centimeters</option>
                    <option value="in^3">Cubic Inches</option>
                    <option value="ft^3">Cubic Feet</option>
                    <option value="yd^3">Cubic Yards</option>
                    <option value="m^3">Cubic Meters</option>
                    <option value="km^3">Cubic Kilometers</option>
                    <option value="mi^3">Cubic Miles</option>
                    <option value="ug">US Gallons</option>
                    <option value="ml">Milliliters</option>
                    <option value="l">Liters/Cubic Decimeters</option>
                    <option value="kgl">Kiloliters</option>
                </select>

                <label for="unitTo">To</label>
                <select id="unitTo">
                    <option value="">--Select Unit--</option>
                    <option value="nm^3">Cubic Nanometers</option>
                    <option value="um^3">Cubic Micrometers</option>
                    <option value="mm^3">Cubic Millimeters</option>
                    <option value="cm^3">Cubic Centimeters</option>
                    <option value="in^3">Cubic Inches</option>
                    <option value="ft^3">Cubic Feet</option>
                    <option value="yd^3">Cubic Yards</option>
                    <option value="m^3">Cubic Meters</option>
                    <option value="km^3">Cubic Kilometers</option>
                    <option value="mi^3">Cubic Miles</option>
                    <option value="ug">US Gallons</option>
                    <option value="ml">Milliliters</option>
                    <option value="l">Liters/Cubic Decimeters</option>
                    <option value="kgl">Kiloliters</option>
                </select>
            </div>
            <div class="buttonContainer">
                <button type="submit" id="convertbtn">Convert</button>
                <button type="button" id="clearbtn">Clear</button>
            </div>
            <div class="checkbox-container">
                <input type="checkbox" id="sciNotation">
                <label for="sciNotation" id="label">Make it Scientific Notation</label>
            </div>
            <p id="result">select a unit</p>

        </form>
    </div>
    <script src="volume.js"></script>
    <script src="nav-button-speed.js"></script>
</body>
</html>
